<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outbreak Watch</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e3e2df;
    --text: #1f1f1d;
    --muted: #6b6a66;
    --accent: #a3372f;
    --new: #fff3ea;
    --new-border: #d98a4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --card: #201f1e;
      --border: #34332f;
      --text: #ecebe7;
      --muted: #9a9891;
      --accent: #e08a7d;
      --new: #2a2116;
      --new-border: #8a5a2c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 2rem 1.25rem 1rem;
    max-width: 780px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  header p { color: var(--muted); margin: 0 0 1rem; font-size: 0.92rem; }
  .controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    max-width: 780px;
    margin: 0 auto;
    padding: 0 1.25rem 1rem;
  }
  input[type="search"], select {
    padding: 0.5rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    font-size: 0.9rem;
  }
  input[type="search"] { flex: 1; min-width: 180px; }
  main { max-width: 780px; margin: 0 auto; padding: 0 1.25rem 3rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.75rem;
  }
  .card.is-new { background: var(--new); border-color: var(--new-border); }
  .card-top {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
    margin-left: 0.4rem;
  }
  .card h2 { font-size: 1.02rem; margin: 0 0 0.4rem; line-height: 1.35; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card p { margin: 0; font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
  #status { color: var(--muted); font-size: 0.85rem; padding: 1rem 0; text-align: center; }
  footer {
    max-width: 780px;
    margin: 0 auto;
    padding: 1rem 1.25rem 3rem;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.5;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>Outbreak Watch</h1>
  <p id="meta">Loading feed…</p>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="Search disease, country, keyword…" />
  <select id="sort">
    <option value="new">Newest first</option>
    <option value="unread">Unread first</option>
  </select>
</div>

<main id="list">
  <p id="status">Loading…</p>
</main>

<footer>
  Aggregates WHO Disease Outbreak News via WHO's public API. Not a substitute for official
  guidance — always check the linked source. Built as an open-source
  <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a> project; PRs adding
  more sources (ProMED, CDC HAN) welcome.
</footer>

<script src="app.js"></script>
</body>
</html>
